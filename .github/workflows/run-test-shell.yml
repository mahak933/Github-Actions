name: Run Shell Script

on:
  workflow_dispatch:
#   push:
#     branches: ["**"]
#   pull_request:
#     branches: ["**"]

jobs:
  test-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure script is executable
        run: chmod +x scripts/run.sh

      - name: Run script (non-zero exit -> fail job)
        run: ./scripts/run.sh