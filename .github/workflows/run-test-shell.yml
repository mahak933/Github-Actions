name: Run Shell Script With Cache

on:
  workflow_dispatch:

jobs:
  test-shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Cache apt packages and other downloads
      - name: Cache system dependencies
        uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cache
          key: ${{ runner.os }}-${{ hashFiles('Scripts/run.sh') }}
          restore-keys: |
            ${{ runner.os }}-


      # 2. Make script executable
      - name: Ensure script is executable
        run: chmod +x Scripts/run.sh

      # 3. Run your shell script
      - name: Run script (non-zero exit -> fail job)
        run: ./Scripts/run.sh