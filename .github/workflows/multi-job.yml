name: Multi-job Workflow

on:
    workflow_dispatch: # this allows us to trigger the workflow manually from github UI

jobs:
    build:
        name: Build Job
        runs-on: ubuntu-latest
        steps:
            - name: Build the project
              run: echo "Building the project..." 
              
    test:
        name: Test Job
        runs-on: ubuntu-latest
        needs: build # this makes sure that test job runs only after build job is successful
        steps:
            - name: Run tests
              run: echo "Running tests..."          

    deploy:
        name: Deploy Job
        runs-on: ubuntu-latest
        needs: build # this makes sure that deploy job runs only after build job is successful
        steps:
            - name: Deploy the project
              run: echo "Deploying the project..."    
              
              