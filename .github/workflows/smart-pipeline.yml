name: Smart Pipeline

on:
    workflow_dispatch:
#   push:     # 1. Trigger on push to any branch
#     branches: ["*"]

jobs:

  # 2a. Lint job (runs in parallel with test)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run linter
        run: echo "Running lint checks..."

  # 2b. Test job (runs in parallel with lint)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: echo "Running tests..."

  # 3. Summary job after both lint and test
  summary:
    runs-on: ubuntu-latest
    needs: [lint, test]   # Must wait for both

    steps:
      - name: Print branch type
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "This is a main branch push."
          else
            echo "This is a feature branch push: ${GITHUB_REF#refs/heads/}"
          fi

      - name: Print commit message
        run: |
          echo "Commit message:"
          echo "${{ github.event.head_commit.message }}"
