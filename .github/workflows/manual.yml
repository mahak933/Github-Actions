name: Manual Trigger

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment to use?"
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true

jobs: 
  show-input:
    runs-on: ubuntu-latest
    steps:
      - name: Print selected environment
        run: |
            echo "Selected environment: ${{ github.event.inputs.environment }}"
