name: Artifact Between Jobs Demo

on:
  workflow_dispatch:

jobs:
  create-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Generate file
        run: |
          mkdir -p output
          echo "This file was created in Job 1" > output/message.txt
          echo "Timestamp: $(date)" >> output/message.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: message-file
          path: output/message.txt

  use-artifact:
    runs-on: ubuntu-latest
    needs: create-artifact   # ensures Job 1 runs before Job 2

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: message-file
          path: downloaded

      - name: Show file contents
        run: |
          echo "Contents of the file downloaded from Job 1:"
          cat downloaded/message.txt